# The crates.io release (RELEASING.md). tools/release/assemble.py merges every
# rust_library under crates/ and vendor/ into one crate with this [package]
# table; its dependencies come from the BUILD.bazel files, MODULE.bazel and
# MODULE.bazel.lock, so they are not listed here.
[package]
name = "maplibre-native-next"
# Bump before running the release workflow; it publishes this version and
# tags the commit v<version>.
version = "0.0.3"
edition = "2024"
description = "A Rust port of the MapLibre Native map rendering core"
license = "BSD-2-Clause"
repository = "https://github.com/louwers/maplibre-native-next"
keywords = ["maplibre", "map", "vector-tiles", "gis", "rendering"]
categories = ["graphics", "rendering::engine", "science::geo"]

# Third-party crates that MODULE.bazel patches (crate.annotation patches) are
# published as forks named <package.name>-<crate>, with the original library
# name, so the code still says `harfrust::`. The upstream version, checksum and
# patches come from MODULE.bazel.lock. Bump `version` whenever the patch or
# the upstream version changes: crates.io never replaces a published version.
[forks.harfrust]
version = "0.15.0"

# Dependencies declared per target, as Cargo cfg expressions. A string limits
# a crate to that cfg; the code gates its use with the same cfg. A table gives
# each cfg its own default-features/features.
[target-dependencies]
# ureq's TLS (rustls, ring) doesn't build for the browser (Emscripten or
# wasm32-unknown-unknown), where mln_storage fetches through the browser
# instead.
ureq = 'cfg(not(target_family = "wasm"))'

# The wasm-bindgen browser build (wasm32-unknown-unknown): mln_storage's
# fetch transport.
js-sys = 'cfg(all(target_family = "wasm", target_os = "unknown"))'
wasm-bindgen = 'cfg(all(target_family = "wasm", target_os = "unknown"))'
wasm-bindgen-futures = 'cfg(all(target_family = "wasm", target_os = "unknown"))'
web-sys = 'cfg(all(target_family = "wasm", target_os = "unknown"))'

# zlib (libz-sys) needs a C library that wasm32-unknown-unknown lacks; the
# browser build decompresses with miniz_oxide.
[target-dependencies.flate2]
'cfg(not(all(target_family = "wasm", target_os = "unknown")))' = {}
'cfg(all(target_family = "wasm", target_os = "unknown"))' = { default-features = false, features = ["rust_backend"] }

# In the browser the port renders through the custom backend over webgpu.h
# (mln_wgpu_webgpu_h); wgpu's GLES backend would link EGL 1.5 functions that
# Emscripten doesn't provide.
[target-dependencies.wgpu]
'cfg(not(target_os = "emscripten"))' = {}
'cfg(target_os = "emscripten")' = { default-features = false, features = ["custom", "parking_lot", "std", "wgsl"] }
